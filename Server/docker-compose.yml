services:
  web:
    # Build the image from the Dockerfile in the current directory (.)
    build: .

    # Name the container
    container_name: AutoShare_Server

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app
      - ./uploads:/uploads
      - ./secrets:/secrets:ro

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Let the app reuse MONGODB_URL from `.env`. The startup code rewrites
      # localhost-style Mongo hosts to host.docker.internal when needed.
      RUNNING_IN_DOCKER: "true"
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      FIREBASE_CREDENTIAL_PATH: /secrets/firebase-service-account.json
      # Optionally loaded from .env; defaults to empty if not set
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
